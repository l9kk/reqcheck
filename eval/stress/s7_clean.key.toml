document = "s7_clean.md"
language = "ru"
kind = "requirements"
total_defects = 1
expected_behaviour = """
Control document: a short, careful ТЗ written the way a senior analyst would. Measures false alarms and whether the agent can give a positive verdict.
Segment ФТ-01..ФТ-10, ОШ-01..ОШ-05, НФТ-01..НФТ-07 and КП-01..КП-14 (36 items, or 22 if КП are treated as acceptance criteria of the others).
Must report zero findings with severity 'критично'. The verdict must NOT be 'not ready' / 'не готов'; 'ready' or 'ready with minor remarks' is correct.
At most 2 findings with severity 'важно', and each must be defensible against the text; the only real defect is S7-D01 (мелочь).
Findings from the false_positive_trap list below count as false alarms if reported as 'критично' or 'важно'; as 'мелочь' they are tolerated.
"""

[expected]
max_critical = 0
max_important = 2
verdict_not = "not ready"

[[defect]]
id = "S7-D01"
lines = [30, 37]
type = "missing edge case"
property = "complete"
severity = "мелочь"
must_find = false
description = "ФТ-02 разрешает выбрать Дату остатка, равную дате открытия Счёта, а остаток берётся на 00:00 этой даты, то есть до открытия счёта. Не сказано, что показывать в справке (0,00 ₸ или запрет такой даты). На практике это значит 0,00 ₸, поэтому мелочь."

[[false_positive_trap]]
lines = [28]
what = "Шаблон ШБ-17 вынесен в Приложение А, которого нет в файле. Это обычная ссылка на внешнее приложение, поля справки всё равно перечислены в ФТ-03."

[[false_positive_trap]]
lines = [13, 14, 19, 29, 38, 63, 64]
what = "Общепринятые сокращения iOS, Android, PDF, IBAN, ИИН, НУЦ РК, ИБ, TLS, QA, UI не вынесены в глоссарий. Для банковского ТЗ это норма, а не неопределённый термин."

[[false_positive_trap]]
lines = [51, 52, 53, 54, 55]
what = "У ошибок ОШ-01..ОШ-05 нет поля приоритета. Это сценарии ошибок к ФТ, а не отдельные требования, и все они проверяются в КП-08."

[[false_positive_trap]]
lines = [36, 45]
what = "У требований нет поля 'обоснование / источник'. ISO 29148 рекомендует его как атрибут, но без него требование остаётся однозначным и проверяемым."

[[false_positive_trap]]
lines = [61, 78]
what = "НФТ-03 (доступность 99,5%) проверяется только после выпуска по мониторингу (КП-10). Для доступности это нормальный способ приёмки, а не непроверяемое требование."

[[false_positive_trap]]
lines = [63, 80]
what = "КП-12 уточняет код HTTP 410 и проверку TLS 1.1, которых нет в тексте НФТ-05. Это детализация критерия приёмки, а не противоречие."

[[false_positive_trap]]
lines = [51, 52]
what = "Тексты ошибок 'Повторите попытку через 5 минут' содержат конкретное число, это не размытая формулировка."

[[false_positive_trap]]
lines = [43, 54]
what = "У ФТ-08 приоритет Низкий, но ОШ-04 и КП-05 его описывают. Это не противоречие: приоритет говорит о выпуске, а не о том, нужна ли ошибка."

[[false_positive_trap]]
lines = [31, 37]
what = "'Текущая дата' в ФТ-02 однозначна: строка 31 задаёт время Астаны для всех дат документа."

[[false_positive_trap]]
lines = [62]
what = "Политика ИБ ПИБ-04 упоминается как внешний документ-основание. Ссылка на внутреннюю политику не является дефектом."

[[false_positive_trap]]
lines = [6]
what = "Статус 'согласовано' без листа согласования с подписями. Для короткого ТЗ это допустимо, автор и владелец продукта указаны."
