# Критерии качества требований. Единый источник правды для всех ролей агента.
# Промпты собираются из этого файла, каждое замечание в отчёте ссылается на id критерия.
# Источники: ISO/IEC/IEEE 29148:2018 п. 5.2.5, 5.2.6, 5.2.7; IEEE Std 830-1998 п. 4.3.

[severity]
critical = "критично"
major = "важно"
minor = "мелочь"
critical_rule = "Блокирует разработку или тестирование: противоречие, непроверяемое требование, нет обязательного поведения, нет ожидаемого результата."
major_rule = "Разработчику или тестировщику придётся додумывать: неполнота, двусмысленность, пропущенный сценарий."
minor_rule = "Формулировка, оформление, терминология, не влияет на реализацию."

# ---------- Отдельное требование: 29148 п. 5.2.5 ----------
[[single]]
id = "necessary"
std = "29148 5.2.5"
name = "Необходимое"
definition = "Требование описывает существенную возможность или ограничение; без него продукт не выполнит цель. Не дублирует другое требование."
violation = "Требование ни на что не влияет, дублирует другое или не связано с целью документа."

[[single]]
id = "appropriate"
std = "29148 5.2.5"
name = "Уместное (уровень детализации)"
definition = "Уровень детализации соответствует уровню документа; нет лишних проектных решений, которые ограничивают реализацию без причины."
violation = "В требовании навязано конкретное техническое решение (протокол, поле, компонент) без обоснования, или требование слишком общее для этого уровня."

[[single]]
id = "unambiguous"
std = "29148 5.2.5"
name = "Однозначное"
definition = "Формулировку можно понять только одним способом; термины определены."
violation = "Расплывчатые слова, неопределённые термины, условие можно прочитать двумя способами."

[[single]]
id = "complete"
std = "29148 5.2.5"
name = "Полное"
definition = "Требование достаточно описывает возможность: условия, граничные значения, ошибки, исключения; не требует догадок."
violation = "Не описаны граничные случаи, ошибки, исключения, единицы измерения, состояния."

[[single]]
id = "singular"
std = "29148 5.2.5"
name = "Единичное"
definition = "Одно требование описывает одну возможность или одно ограничение."
violation = "В одном пункте смешаны несколько независимых правил, которые придётся проверять разными тестами."

[[single]]
id = "feasible"
std = "29148 5.2.5"
name = "Реализуемое"
definition = "Требование можно выполнить в заданных ограничениях (технологии, сроки, данные)."
violation = "Требует данных или событий, которых нет в описанной архитектуре, или физически невыполнимо."

[[single]]
id = "verifiable"
std = "29148 5.2.5"
name = "Проверяемое"
definition = "Есть конечный объективный способ доказать выполнение: измеримый критерий, ожидаемый результат."
violation = "Нельзя написать тест с однозначным ожидаемым результатом; нет метрики, порога, способа измерения."

[[single]]
id = "correct"
std = "29148 5.2.5"
name = "Корректное"
definition = "Требование точно отражает потребность заинтересованной стороны, без фактических ошибок."
violation = "Расчёт, пример или формулировка неверны относительно других частей документа или предметной области."

[[single]]
id = "conforming"
std = "29148 5.2.5"
name = "Соответствует шаблону"
definition = "Требование оформлено по принятому шаблону и стилю документа."
violation = "Нет идентификатора, нарушен шаблон, раздел не заполнен."

# ---------- Набор требований: 29148 п. 5.2.6 ----------
[[set]]
id = "set_complete"
std = "29148 5.2.6"
name = "Полнота набора"
definition = "Набор не нуждается в дополнении: описаны все функции, ошибки, нефункциональные требования, интеграции, данные, критерии приёмки."
violation = "Пропущены сценарии, разделы пустые, нет требований к ошибкам, безопасности, откату."

[[set]]
id = "set_consistent"
std = "29148 5.2.6"
name = "Согласованность набора"
definition = "Требования не противоречат друг другу, терминология и единицы едины по всему документу."
violation = "Два места документа требуют разного поведения; разные названия одного объекта; разные единицы."

[[set]]
id = "set_feasible"
std = "29148 5.2.6"
name = "Реализуемость набора"
definition = "Весь набор можно реализовать вместе в рамках ограничений."
violation = "Совместное выполнение требований невозможно или требует того, чего нет в архитектуре."

[[set]]
id = "set_comprehensible"
std = "29148 5.2.6"
name = "Понятность набора"
definition = "Понятно, что ожидается от системы и как требования связаны между собой."
violation = "Неясна связь между разделами, схемы описаны неполно, ссылки ведут в никуда."

[[set]]
id = "set_validatable"
std = "29148 5.2.6"
name = "Возможность валидации"
definition = "Можно доказать, что набор приведёт к достижению цели и потребностей заинтересованных сторон."
violation = "Цель не измерима, критерии приёмки не покрывают требования."

# ---------- Спецификация: IEEE 830 п. 4.3 ----------
[[srs]]
id = "srs_ranked"
std = "IEEE 830 4.3.6"
name = "Ранжирование по важности и стабильности"
definition = "У требований есть приоритет или признак стабильности."
violation = "Нет приоритетов: непонятно, что делать первым и что можно отложить."

[[srs]]
id = "srs_modifiable"
std = "IEEE 830 4.3.8"
name = "Модифицируемость"
definition = "Структура позволяет вносить изменения: есть версия, история, нет дублирования."
violation = "Нет версии и даты, одно правило повторено в нескольких местах."

[[srs]]
id = "srs_traceable"
std = "IEEE 830 4.3.9"
name = "Трассируемость"
definition = "У каждого требования есть идентификатор, понятен источник и связь с тестами и дочерними документами."
violation = "Нет идентификаторов, нет связи требование -> критерий приёмки -> API."

# ---------- Язык требований: 29148 п. 5.2.7 (для линтера) ----------
[language]
std = "29148 5.2.7"
superlatives = ["лучший", "наилучший", "максимально", "оптимальн", "самый"]
subjective = ["удобн", "простой", "интуитивн", "дружелюбн", "красив", "эффективн", "качественн"]
vague_adverbs = ["быстро", "своевременно", "оперативно", "значительн", "минимальн", "достаточн", "приемлем", "почти", "обычно", "как правило", "некоторое время", "некоторых случаях", "при необходимости повторяет"]
open_ended = ["и т.п.", "и т.д.", "и тому подобное", "и так далее", "в том числе", "но не ограничиваясь", "как минимум"]
loopholes = ["по возможности", "при необходимости", "если возможно", "при наличии", "по усмотрению", "желательно", "может быть"]
placeholders = ["TBD", "TODO", "уточнить", "заполняются", "не заполнен", "Да / Нет", "xxx", "???", "уточняется", "будет уточнено", "TBC", "TBA"]

# ---------- Проверка граничных случаев: общий чек-лист «что будет, если» (не привязан к документу) ----------
[[edge]]
id = "E01"
name = "Границы периода и часовой пояс"
ask = "Как определяются границы суток, месяца и другого периода; в каком часовом поясе тикают часы, о которых говорит документ; что при смене часового пояса или переходе на другое время (в том числе по закону), в первые и последние секунды периода, в нерабочие дни."

[[edge]]
id = "E02"
name = "Поздние, неупорядоченные и повторные события"
ask = "Что если событие пришло с опозданием (после закрытия периода или после действий над той же сущностью), не в порядке отправки или дважды; есть ли ключ идемпотентности и правило, какое событие главнее."

[[edge]]
id = "E03"
name = "Область действия правила"
ask = "К чему применяется правило: к одной карте, клиенту, счёту, договору, устройству или всему банку; что если у клиента несколько таких сущностей; общий или раздельный счётчик и лимит."

[[edge]]
id = "E04"
name = "Идентификаторы и токены"
ask = "Какой идентификатор сущности используется, стабилен ли он (перевыпуск, токенизация, замена номера); что если один объект приходит под разными идентификаторами или один идентификатор указывает на разные объекты."

[[edge]]
id = "E05"
name = "Числа: тип, единицы, округление, переполнение"
ask = "Тип и диапазон чисел, единицы (валюта, минимальная единица, проценты), правило и порядок округления, нулевые, отрицательные и очень большие значения, переполнение, точность дробей."

[[edge]]
id = "E06"
name = "Кто и по какому признаку относит к категории"
ask = "Кто (какая система или сторона) решает, что операция относится к категории, по какому атрибуту, что если признак отсутствует, неверен, меняется или двусмысленен."

[[edge]]
id = "E07"
name = "Сумма и состав операции меняются между шагами"
ask = "Что если сумма, валюта, статус или состав операции меняются между этапами (резерв и списание, частичное исполнение, возврат, отмена, конвертация по другому курсу); от какого значения считается правило."

[[edge]]
id = "E08"
name = "Повторные действия, злоупотребление, ограничения частоты"
ask = "Что если пользователь или система повторяет действие много раз, быстро, параллельно или обходит правило (дробление, цикл включения и выключения); есть ли лимиты частоты и защита."

[[edge]]
id = "E09"
name = "Сбои внешних зависимостей"
ask = "Для каждой внешней системы или шага: что при недоступности, таймауте, ошибке, частичном ответе, повторной попытке; что видит клиент; можно ли потерять или задвоить результат."

[[edge]]
id = "E10"
name = "Жизненный цикл главной сущности"
ask = "Что с правилом и накопленным состоянием, если главная сущность заблокирована, приостановлена, перевыпущена, закрыта, передана, истекла или удалена."

[[edge]]
id = "E11"
name = "Выключение функции"
ask = "Что если функцию выключить или отозвать согласие: судьба накопленного состояния и запланированных действий, действия в полёте, повторное включение, откат релиза."

[[edge]]
id = "E12"
name = "Хранение данных и приватность"
ask = "Какие данные хранятся и сколько, кто их видит, что с персональными данными, логами и уведомлениями, удаление по запросу клиента, маскирование."
