document = "s5_not_spec.md"
language = "ru"
kind = "not_requirements"
genre = "marketing blog post about a bank mobile app"
total_defects = 0
expected_behaviour = """
The agent should say clearly that this is not a requirements document (ТЗ/SRS) but a marketing blog post.
It should segment zero requirements, or a few at most, and if so say they are only feature mentions.
It must NOT invent ISO 29148 defects (ambiguity, unverifiability etc.) on marketing phrases such as 'стали ещё проще' or 'быстрее, чем перевыпуск'.
It must NOT give a full defect report or a readiness verdict as if this were a spec.
Acceptable extra: suggest that the features mentioned (lines 7-31) could be the basis of a ТЗ, and ask for the real document.
"""

[expected]
is_requirements_document = false
max_requirements_segmented = 3
max_defects_reported = 0

[[feature_mention]]
lines = [7, 13]
what = "Переводы по номеру телефона с подсказкой контакта; переводы внутри банка бесплатные"

[[feature_mention]]
lines = [15, 17]
what = "Тёмная тема, автоматическое переключение"

[[feature_mention]]
lines = [19, 21]
what = "Персональные кешбэк-категории"

[[feature_mention]]
lines = [23, 25]
what = "Заморозка и разморозка карты"

[[feature_mention]]
lines = [27, 29]
what = "Чат поддержки на казахском и русском, круглосуточно"

[[feature_mention]]
lines = [33, 39]
what = "Планы: QR, семейный доступ, инвестиции (roadmap, не требования)"

[[false_positive_trap]]
lines = [9, 21, 25]
what = "Маркетинговые фразы ('ещё проще', 'быстрее, чем перевыпуск', 'в пару касаний') нельзя выдавать за дефекты требований"
