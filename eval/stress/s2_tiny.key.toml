document = "s2_tiny.txt"
language = "ru"
encoding = "cp1251, CRLF line endings (tenge sign written as 'тг.' since it is not in cp1251)"
kind = "requirements"
total_defects = 4
expected_behaviour = "Decode cp1251 correctly (no mojibake in quotes), segment 7 requirements and report the 4 defects. No invented defects beyond these, since the doc is tiny."

[[defect]]
id = "S2-D01"
lines = [3, 6]
type = "contradiction"
property = "consistent"
severity = "критично"
must_find = true
description = "Порог по умолчанию: 5 000 тенге в п. 2 и 1 000 тенге в п. 5."

[[defect]]
id = "S2-D02"
lines = [4]
type = "unverifiable"
property = "verifiable"
severity = "важно"
must_find = true
description = "'Отправляется своевременно': задержка после операции не задана (секунды или минуты)."

[[defect]]
id = "S2-D03"
lines = [7]
type = "unverifiable / missing rule"
property = "verifiable / complete"
severity = "важно"
must_find = true
description = "'Не должны надоедать': нет измеримого правила. Не сказано, отправлять ли уведомление повторно при каждой следующей операции, пока остаток ниже порога, и есть ли лимит частоты (например, не чаще 1 раза в сутки на карту)."

[[defect]]
id = "S2-D04"
lines = [2, 5, 8]
type = "undefined term / missing edge case"
property = "unambiguous"
severity = "важно"
must_find = true
description = "Для кредитных карт (п. 7) не определено, что такое 'остаток': собственные средства или доступный кредитный лимит. Не описаны мультивалютные карты, у которых порог в тенге."
