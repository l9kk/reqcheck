total_defects = 7
expected_behaviour = """
Kazakh source (Cyrillic), report in Russian. Read the Kazakh correctly and quote it without distortion.
Segment requirements 1-13 of section 4, errors Қ-01..Қ-03 and acceptance criteria ҚК-01..ҚК-09, and report the planted defects below.
The distant contradiction between section 3 and ҚК-03 is the main test.
Acceptable extra findings (not counted as false alarms): no NFR section at all (performance, availability, security);
ЖТСМ values are not given, only 'банктің мөлшерлемелер кестесі' in ҚК-02; top-ups in п.11 can push the deposit over the 20 000 000 ₸ maximum;
no version history; no failure handling for the push in п.7.
"""

[[defect]]
id = "S8-D01"
lines = [24, 55]
type = "contradiction"
property = "consistent"
severity = "критично"
must_find = true
description = "Минимальный первый взнос: 10 000 ₸ в разделе 3 (стр. 24), но в ҚК-03 (стр. 55) кнопка 'Жалғастыру' неактивна при 49 999 ₸ и активна только с 50 000 ₸. Через Қ-02 ограничение ссылается на раздел 3, поэтому тест приёмки противоречит условиям."

