language = "ru"
kind = "requirements"
total_defects = 8
locator_note = """
A .docx has no stable line numbers. 'lines' below are 1-based block numbers in document order:
each paragraph, heading or bullet is one block, and each table row is one block (header row = 29).
Requirement ids (ФТ-xx) are the reliable locator; 'pdf_page' is the page in the PDF.
"""
expected_behaviour = "Extract text from DOCX (including the table and the bullet lists) and from PDF; segment ФТ-01..ФТ-15, НФТ-01..03, ИНТ-01..02, КП-01..05; report the defects below. Both formats should give the same findings."

